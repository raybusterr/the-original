<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Again.</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #fff;
      color: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(86vw, 620px); text-align: center; padding: 24px; }
    #qr {
      display: block;
      width: min(82vw, 520px);
      height: auto;
      margin: 0 auto;
      image-rendering: pixelated;
    }
    noscript { font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <img id="qr" alt="QR code that links back to this page" />
    <noscript>This page needs JavaScript enabled to create its QR code.</noscript>
  </main>

  <!-- QRCode.js. The QR is generated from this page's own URL, so it loops back to itself. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script>
    (async () => {
      // Remove query strings/fragments so the printed destination stays clean and stable.
      const selfURL = location.origin + location.pathname;
      const img = document.getElementById('qr');

      try {
        img.src = await QRCode.toDataURL(selfURL, {
          errorCorrectionLevel: 'H',
          margin: 4,
          width: 1200,
          color: { dark: '#000000', light: '#ffffff' }
        });
      } catch (err) {
        console.error(err);
        img.alt = 'Could not generate QR code.';
      }
    })();
  </script>
</body>
</html>
